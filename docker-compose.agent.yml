# agent API(멀티에이전트 웹) — docker compose 사용(추천) 또는 docker-compose.agent.yml up
#   서버(192.99.201.121)에서 LLM 들(myllm llama 8081-8088 + Ollama 11434)이
#   호스트 프로세스로 떠 있으므로 `network_mode: host` 로 컨테이너가 그대로 본다.
#   - 우리 앱(agent API) 은 호스트의 8080 포트로 노출 (Dockerfile CMD: uvicorn --port 8080).
#   - 외부 LLM 서비스(myllm Script Runner) 는 18080 을 쓰므로 agent 는 8080 으로 전용.
#   - 기본 live 모드 = 실제 추론 서버 호출 (오프라인은 AGENT_MODE=mock).
#
# 사용:
#   bash server-up.sh
#   bash server-down.sh
services:
  gateway:
    image: agent-gateway:latest
    build:
      context: .
      dockerfile: docker/agent-gateway.Dockerfile
    container_name: agent-gateway
    network_mode: host        # 127.0.0.1:8081-8088 / 11434 이 호스트 것 그대로
    restart: unless-stopped
    volumes:
      # 결과 notes 영속 (호스트 ./agent-notes)
      - ./agent-notes:/app/notes
      # (RAG) 책 청크 store — 기본은 호스트 ./study/data/store 를 /app/store 로 마운트.
      # 실제 store(서버 /data/store 또는 calc.jsonl 폴더)가 다르면 아래와
      # STEMER_STORE 를 실경로로 맞춘다.
      - ./study/data/store:/app/store
    environment:
      # live(실제 llama/Ollama) | mock(오프라인 echo 데모)
      AGENT_MODE: ${AGENT_MODE:-live}
      # role 주소 기본값은 agent/registry.py (127.0.0.1:8081-8088). 필요 시 오버라이드:
      # AGENT_PARSER / AGENT_WORKERS / AGENT_CODERS / AGENT_REASONER / AGENT_EMBED(CSV)
      # (모델 기동) myLLM Script Runner(DOC/1) — 외부 LLM 서비스, 18080. /run-plans 시 자동 부팅
      MYLLM_API: ${MYLLM_API:-http://127.0.0.1:18080}
      MYLLM_TOKEN: ${MYLLM_TOKEN:-}
      AGENT_BOOT_MODELS: ${AGENT_BOOT_MODELS:-1}
      # book-store RAG 가 근거를 로드할 store 경로 (위 마운트 기준)
      STEMER_STORE: ${STEMER_STORE:-/app/store}
    ports: []                 # host network 라 포트 매핑 불필요
