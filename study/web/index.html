<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Study RAG Pipeline</title>
</head>
<body>
<h1>Study RAG Pipeline</h1>

<h2>1. PDF 업로드</h2>
<form id="uploadForm" enctype="multipart/form-data">
  <input type="file" id="file" accept=".pdf" required>
  <button type="submit">업로드</button>
</form>
<p id="uploadMsg"></p>

<h2>2. 에이전트 지시사항 (AGENTS.md 내용)</h2>
<form id="agentsForm">
  <textarea id="agents" rows="20" cols="100"></textarea>
  <br>
  <button type="submit">저장</button>
</form>
<p id="agentsMsg"></p>

<h2>3. 토픽 설정</h2>
<form id="topicForm">
  Topic: <input type="text" id="topic" required>
  Book: <select id="book"></select>
  Section: <input type="text" id="section" placeholder="3.5 또는 3.5, 3.6">
  Kind:
  <select id="kind">
    <option value="note">note (개념 노트)</option>
    <option value="problems">problems (기초10 + 중급10 + 풀이)</option>
  </select>
  Note file: <input type="text" id="note" placeholder="notes/01-normal.md (생략 가능)">
  <button type="submit">추가 (todo)</button>
</form>
<p id="topicMsg"></p>

<h2>4. 상태</h2>
<p>llama-server: <span id="llama"></span></p>
<table border="1">
  <tr>
    <th>topic</th><th>book</th><th>section</th><th>kind</th><th>status</th><th>note</th><th></th>
  </tr>
  <tbody id="topics"></tbody>
</table>

<h2>5. 결과물 다운로드</h2>
<p><a href="/api/notes/download">notes + problems ZIP 다운로드</a></p>
<h3>노트</h3>
<ul id="notes"></ul>
<h3>문제 / 풀이</h3>
<ul id="problems"></ul>

<h2>로그 (최근)</h2>
<pre id="log"></pre>

<script>
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

async function api(method, url, body) {
  const opt = { method: method, headers: {} };
  if (body && !(body instanceof FormData)) {
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  } else if (body) {
    opt.body = body;
  }
  const r = await fetch(url, opt);
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch (e) { /* keep statusText */ }
    throw new Error(detail);
  }
  return r.json();
}

async function refreshStatus() {
  try {
    const s = await api('GET', '/api/status');
    document.getElementById('llama').textContent = s.llama_healthy ? 'OK' : 'DOWN';

    const tb = document.getElementById('topics');
    tb.innerHTML = '';
    for (const t of s.topics) {
      const tr = document.createElement('tr');
      const next = t.status !== 'done' ? 'done' : 'todo';
      tr.innerHTML = '<td>' + esc(t.topic) + '</td><td>' + esc(t.book) + '</td>' +
        '<td>' + esc(t.section) + '</td><td>' + esc(t.kind) + '</td><td>' + esc(t.status) + '</td>' +
        '<td>' + esc(t.note) + '</td>';
      const td = document.createElement('td');
      const btn = document.createElement('button');
      btn.textContent = next;
      btn.onclick = async function () {
        try {
          await api('PATCH', '/api/topics/' + encodeURIComponent(t.topic), { status: next });
          refreshStatus();
        } catch (e) { alert(e.message); }
      };
      td.appendChild(btn);
      tr.appendChild(td);
      tb.appendChild(tr);
    }

    const nl = document.getElementById('notes');
    nl.innerHTML = '';
    for (const n of s.notes) {
      const li = document.createElement('li');
      li.innerHTML = '<a href="/api/notes/' + encodeURIComponent(n) + '">' + esc(n) + '</a>';
      nl.appendChild(li);
    }

    const pl = document.getElementById('problems');
    pl.innerHTML = '';
    for (const p of s.problems || []) {
      const li = document.createElement('li');
      li.innerHTML = '<a href="/api/problems/' + encodeURIComponent(p) + '">' + esc(p) + '</a>';
      pl.appendChild(li);
    }

    document.getElementById('log').textContent = s.log_tail;

    const sel = document.getElementById('book');
    const cur = sel.value;
    sel.innerHTML = '';
    for (const b of s.books) {
      const o = document.createElement('option');
      o.value = b.book_id;
      o.textContent = b.book_id + (b.title ? ' — ' + b.title : '');
      sel.appendChild(o);
    }
    sel.value = cur;
  } catch (e) {
    document.getElementById('log').textContent = 'status error: ' + e.message;
  }
}

document.getElementById('uploadForm').onsubmit = async function (ev) {
  ev.preventDefault();
  const fd = new FormData();
  fd.append('file', document.getElementById('file').files[0]);
  try {
    const r = await api('POST', '/api/books/upload', fd);
    document.getElementById('uploadMsg').textContent = '업로드됨: ' + r.saved + ' — ' + r.message;
  } catch (e) {
    document.getElementById('uploadMsg').textContent = '실패: ' + e.message;
  }
};

document.getElementById('agentsForm').onsubmit = async function (ev) {
  ev.preventDefault();
  try {
    await api('POST', '/api/agents', { content: document.getElementById('agents').value });
    document.getElementById('agentsMsg').textContent = '저장됨';
  } catch (e) {
    document.getElementById('agentsMsg').textContent = '실패: ' + e.message;
  }
};

document.getElementById('topicForm').onsubmit = async function (ev) {
  ev.preventDefault();
  try {
    await api('POST', '/api/topics', {
      topic: document.getElementById('topic').value,
      book: document.getElementById('book').value,
      section: document.getElementById('section').value,
      kind: document.getElementById('kind').value,
      note: document.getElementById('note').value,
    });
    document.getElementById('topicMsg').textContent = '추가됨 (todo)';
    this.reset();
    refreshStatus();
  } catch (e) {
    document.getElementById('topicMsg').textContent = '실패: ' + e.message;
  }
};

(async function init() {
  try {
    const a = await api('GET', '/api/agents');
    document.getElementById('agents').value = a.content || '';
  } catch (e) { /* api may be briefly down at boot */ }
  refreshStatus();
  setInterval(refreshStatus, 15000);
})();
</script>
</body>
</html>
