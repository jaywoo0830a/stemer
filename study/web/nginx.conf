# nginx frontend for the study RAG pipeline.
# Serves the plain-HTML UI and proxies /api/ to the FastAPI service
# (both containers share the host network, so 127.0.0.1:8001 works).
#
# NOTE: this file is mounted as /etc/nginx/conf.d/default.conf, which the
# official image's main nginx.conf includes INSIDE an `http {}` block.
# Therefore only http-level and server-level directives belong here —
# a nested `events`/`http` block crashes nginx at startup.

# Allow large textbook PDFs through the proxy.
client_max_body_size 2g;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
