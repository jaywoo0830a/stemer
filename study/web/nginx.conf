# nginx frontend for the study RAG pipeline.
# Serves the plain-HTML UI and proxies /api/ to the FastAPI service
# (both containers share the host network, so 127.0.0.1:8001 works).
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Allow large textbook PDFs through the proxy.
    client_max_body_size 2g;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
