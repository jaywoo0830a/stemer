services:
  study:
    image: study:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        EMBED: ${EMBED:-0}
        DOCLING: ${DOCLING:-0}
    # 호스트 네트워크 공유 — 컨테이너가 호스트의 127.0.0.1 을 그대로 본다.
    # (로컬 Ollama 후처리 11434 연결이 host.docker.internal 게이트웨이 경유보다 확실)
    network_mode: host
    volumes:
      - ./books:/books          # 입력 PDF 폴더 (호스트 study/books)
      - ./data:/data            # 영속: registry.json / store/ / notes/
      - hf-cache:/root/.cache/huggingface   # HF 모델 캐시 영속(재다운로드 방지)
    # /dev/shm 확대: docling 스레드 파이프라인/DataLoader 공유메모리 (기본 64MB 는 부족)
    shm_size: '2gb'
    ulimits:
      nofile:                    # 대형 PDF·수천 청크의 파일 핸들
        soft: 65535
        hard: 65535
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      HF_TOKEN: ${HF_TOKEN:-}             # HF 다운로드 인증(읽기 전용) → rate limit 상향
      HF_ENDPOINT: ${HF_ENDPOINT:-}       # 미러(예: https://hf-mirror.com) 선택
      # 스레드는 코드가 관리한다(_cap_worker_threads / docling AcceleratorOptions).
      # 여기 OMP 캡을 두면 docling 단독 실행까지 2스레드로 묶여 역효과 → 제거.
      # jobs 병렬 인제스트는 워커가 스스로 OMP 캡을 건다.
      TOKENIZERS_PARALLELISM: "false"
      # AVX-512 지원 CPU(Zen4/5, 9700X)에서 oneDNN 이 AVX-512 커널을 쓰도록.
      # 지원 안 하는 CPU에서 강제하면 크래시 → 미지원 CPU 배포 시 비워둘 것.
      ONEDNN_MAX_CPU_ISA: ${ONEDNN_MAX_CPU_ISA:-AVX512_CORE}
      # docling 수식 디코딩(FORMULAS) — 재인제스트 때만 켠다 (기본 off)
      DOCLING_FORMULAS: ${DOCLING_FORMULAS:-0}
      DOCLING_FORMULA_PRESET: ${DOCLING_FORMULA_PRESET:-codeformulav2}
      DOCLING_FORMULA_FP32: ${DOCLING_FORMULA_FP32:-1}
      # docling 처리 시 표 구조 추출 (FORMULAS 온전성 검사 때는 0 도 가능)
      DOCLING_TABLES: ${DOCLING_TABLES:-1}
      # 로컬 LLM(Ollama) KaTeX 후처리 — 게이트: POSTKATEX=1 로 켠다
      # network_mode: host → 컨테이너가 호스트 loopback 을 봄 (127.0.0.1 이 호스트 Ollama)
      LOCAL_LLM: ${LOCAL_LLM:-0}             # 1 이면 개념 생성도 로컬(DeepSeek 불필요)
      LOCAL_LLM_FREE: ${LOCAL_LLM_FREE:-0}   # 1 이면 스키마 무시·로컬 자유 markdown 생성
      POSTKATEX: ${POSTKATEX:-0}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://127.0.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-lfm2.5:1.2b-instruct}
    command: ["python", "-m", "study_lib.cli", "status"]

volumes:
  hf-cache:
