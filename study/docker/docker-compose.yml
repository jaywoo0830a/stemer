name: study-rag

# Shared image build + volume mounts for the Python services.
x-rag-common: &rag-common
  build:
    context: .
  image: study-rag:latest
  volumes:
    # The whole study/ folder (books, index, notes, tools, TOPICS.md).
    - ..:/data
    # HuggingFace model cache survives rebuilds (embedding + reranker).
    - hf-cache:/root/.cache/huggingface

x-rag-env: &rag-env
  STUDY_ROOT: /data
  LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://127.0.0.1:8000/v1}
  LLAMA_API_KEY: ${LLAMA_API_KEY:-}
  REASONING_EFFORT: ${REASONING_EFFORT:-low}
  MAX_TOKENS: ${MAX_TOKENS:-4096}
  WATCH_INTERVAL_S: ${WATCH_INTERVAL_S:-300}
  LLM_START_TIMEOUT_S: ${LLM_START_TIMEOUT_S:-180}
  # Postgres+pgvector backend (empty = SQLite+Chroma fallback).
  DATABASE_URL: ${DATABASE_URL:-}
  PG_USER: ${PG_USER:-study}
  PG_PASSWORD: ${PG_PASSWORD:-study}
  PG_DB: ${PG_DB:-study}
  OMP_NUM_THREADS: ${OMP_NUM_THREADS:-14}
  VLM_BASE_URL: ${VLM_BASE_URL:-}
  VLM_API_KEY: ${VLM_API_KEY:-}
  VLM_MODEL: ${VLM_MODEL:-local}
  DOCLING_IMAGES_SCALE: ${DOCLING_IMAGES_SCALE:-2.0}
  DOCLING_FORMULA_PRESET: ${DOCLING_FORMULA_PRESET:-codeformulav2}
  DOCLING_OCR_MODE: ${DOCLING_OCR_MODE:-default}
  DOCLING_OCR_LANG: ${DOCLING_OCR_LANG:-en}
  DOCLING_HEADING_HIERARCHY: ${DOCLING_HEADING_HIERARCHY:-on}
  DOCLING_CHART_EXTRACTION: ${DOCLING_CHART_EXTRACTION:-on}
  DOCLING_CODE_ENRICHMENT: ${DOCLING_CODE_ENRICHMENT:-on}
  DOCLING_PICTURE_DESCRIPTION: ${DOCLING_PICTURE_DESCRIPTION:-off}
  DOCLING_PICTURE_PRESET: ${DOCLING_PICTURE_PRESET:-smolvlm}
  DOCLING_PICTURE_AREA_THRESHOLD: ${DOCLING_PICTURE_AREA_THRESHOLD:-0.05}
  DOCLING_LAYOUT_PRESET: ${DOCLING_LAYOUT_PRESET:-}

services:
  # Postgres 17 + pgvector — high-performance Dockerized RAG database
  # (HNSW vector index + pg_trgm lexical). Host networking -> 127.0.0.1:5432.
  db:
    image: pgvector/pgvector:pg17
    network_mode: host
    environment:
      POSTGRES_USER: ${PG_USER:-study}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-study}
      POSTGRES_DB: ${PG_DB:-study}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${PG_USER:-study} -d $${PG_DB:-study}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Functional phase runner (run-once) — driven by study/pipeline.sh:
  #   docker compose run --rm pipeline python tools/study.py <index|generate|prefetch|status>
  pipeline:
    <<: *rag-common
    # host networking: llama-server listens on the host's 127.0.0.1:8000.
    network_mode: host
    environment: *rag-env
    command: ["python", "-u", "tools/study.py", "status"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

volumes:
  hf-cache:
  pgdata:
